<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freigabe - myCloud</title>
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Floating Glowing Orbs Background -->
  <div id="glowing-orbs-container" style="position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;">
    <div style="position: absolute; width: 480px; height: 480px; border-radius: 50%; filter: blur(72px); opacity: 0.55; top: -130px; left: -110px; background: radial-gradient(circle, var(--color-accent), transparent 70%); animation: f1 19s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 440px; height: 440px; border-radius: 50%; filter: blur(72px); opacity: 0.5; top: -70px; right: -90px; background: radial-gradient(circle, #bf5af2, transparent 70%); animation: f2 23s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; filter: blur(72px); opacity: 0.45; bottom: -130px; left: 12%; background: radial-gradient(circle, #30d158, transparent 70%); animation: f3 21s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(72px); opacity: 0.45; bottom: -90px; right: 6%; background: radial-gradient(circle, #ff9f0a, transparent 70%); animation: f1 26s ease-in-out infinite;"></div>
  </div>

  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo">
        <i data-lucide="cloud"></i> my<span>Cloud</span> Shared
      </div>
      <div class="user-nav" style="display: flex; align-items: center; gap: 0.75rem;">
        <span class="badge" id="share-owner-badge" style="font-weight: 500; margin: 0;">Geteilter Inhalt</span>
      </div>
    </header>

    <!-- CONTENT -->
    <!-- Passwort-Bereich -->
    <div class="card" id="password-block-view" style="display: none; max-width: 500px; margin: 6rem auto; padding: 2.5rem; text-align: center;">
      <i data-lucide="lock" style="width: 48px; height: 48px; color: var(--color-accent); margin-bottom: 1rem;"></i>
      <h3>Freigabe ist passwortgeschützt</h3>
      <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Bitte gib das Passwort ein, um auf die freigegebenen Dateien zuzugreifen.</p>
      <form id="password-unlock-form">
        <div class="form-group">
          <input type="password" id="share-pass-input" class="form-control" placeholder="Passwort eingeben" required style="text-align: center;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
          <i data-lucide="unlock"></i> Freischalten
        </button>
      </form>
    </div>

    <main class="explorer" id="main-explorer">

      <!-- Einzeldatei-Ansicht (Download / Vorschau) -->
      <div class="card share-single-card" id="single-file-card" style="display: none;">
        <div class="share-single-thumb" id="single-file-thumb"></div>
        <h2 class="share-single-name" id="single-file-name"></h2>
        <p class="share-single-meta" id="single-file-meta"></p>
        <div class="share-single-actions" id="single-file-actions"></div>
      </div>

      <!-- Geteilte Ordner Info -->
      <div class="card" id="share-meta-card" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h2 id="shared-title" style="display: flex; align-items: center; gap: 0.5rem;">
            <i data-lucide="folder"></i> Ordner laden...
          </h2>
          <div class="share-permissions-badges" id="share-permissions-badges" style="justify-content: flex-start;">
            <!-- Badges werden dynamisch geladen -->
          </div>
        </div>
        <div>
          <button class="btn btn-primary" id="download-all-zip-btn" style="display: none;">
            <i data-lucide="file-archive"></i> Als ZIP herunterladen
          </button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar" id="share-toolbar">
        <div class="breadcrumbs" id="share-breadcrumbs">
          <!-- Dynamisch -->
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <!-- Upload Button, nur sichtbar bei Schreibrechten -->
          <label class="btn btn-primary" id="public-upload-label" style="display: none; margin: 0; cursor: pointer;">
            <i data-lucide="upload"></i> Datei hochladen
            <input type="file" id="public-file-upload-input" style="display: none;">
          </label>
        </div>
      </div>

      <!-- Dropzone (nur sichtbar bei Schreibrechten) -->
      <div id="public-dropzone" class="dropzone" style="display: none; padding: 4rem 2rem;">
        <i data-lucide="upload-cloud" style="width: 56px; height: 56px; color: var(--color-accent); margin-bottom: 0.5rem;"></i>
        <p id="dropzone-text">Dateien per Drag & Drop in diese Freigabe hochladen</p>
      </div>

      <!-- Dateiliste -->
      <div class="file-grid" id="public-file-grid">
        <!-- Dynamisch generiert -->
      </div>
    </main>
  </div>

  <!-- NOTIFICATION TOAST -->
  <div class="notification" id="public-toast">
    <span id="public-toast-message">Meldung</span>
  </div>

  <!-- CODE EDITOR MODAL -->
  <div class="modal-overlay" id="code-editor-overlay" style="padding: 0; z-index: 10000; width: 100vw; height: 100vh; background: var(--editor-bg);">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">

      <!-- Editor Titlebar (shared design with the dashboard editor) -->
      <div class="editor-titlebar">

        <!-- Left: file icon + name + collab -->
        <div class="editor-titlebar-left">
          <div class="editor-file-badge">
            <i data-lucide="file-code" style="width:16px;height:16px;"></i>
          </div>
          <span id="code-editor-title" style="font-weight:600; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; color:var(--editor-fg);">Editor</span>
          <div id="collab-users-container" class="editor-collab-pill" style="display:none;">
            <span class="editor-collab-dot"></span>
            <span id="collab-users-list" style="font-size:0.75rem; font-weight:500;">Nur du</span>
          </div>
        </div>

        <!-- Center: language selector -->
        <div class="editor-lang-wrap">
          <i data-lucide="code-2" style="width:13px;height:13px;opacity:0.6;"></i>
          <select id="monaco-lang-select" class="editor-lang-select" title="Programmiersprache wechseln">
            <option value="plaintext">Plaintext</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="scss">SCSS</option>
            <option value="less">Less</option>
            <option value="json">JSON</option>
            <option value="xml">XML</option>
            <option value="markdown">Markdown</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="php">PHP</option>
            <option value="ruby">Ruby</option>
            <option value="shell">Shell</option>
            <option value="sql">SQL</option>
            <option value="yaml">YAML</option>
            <option value="dockerfile">Dockerfile</option>
            <option value="graphql">GraphQL</option>
          </select>
        </div>

        <!-- Right: save status + buttons -->
        <div class="editor-titlebar-right">
          <span id="editor-save-status" class="editor-save-status"></span>
          <kbd class="editor-kbd">Strg+S</kbd>
          <button id="share-link-btn" class="editor-btn" title="Freigabe-Link kopieren">
            <i data-lucide="link" style="width:15px;height:15px;"></i>
            <span>Link teilen</span>
          </button>
          <button id="save-code-editor-btn" class="editor-btn editor-btn-save" title="Speichern (Strg+S)">
            <i data-lucide="save" style="width:15px;height:15px;"></i>
            <span>Speichern</span>
          </button>
          <div class="editor-divider"></div>
          <button id="close-code-editor-btn" class="editor-btn editor-btn-close" title="Schließen (ESC)">
            <i data-lucide="x" style="width:15px;height:15px;"></i>
          </button>
        </div>
      </div>
      <div id="monaco-editor-container" style="flex: 1; width: 100%; height: 100%; background: var(--editor-bg);"></div>
    </div>
  </div>

  <!-- IMAGE VIEWER MODAL -->
  <div class="modal-overlay" id="image-viewer-overlay" style="padding: 0; z-index: 10000; width: 100vw; height: 100vh; background: var(--modal-bg); backdrop-filter: var(--glass-blur);">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--glass-bg); border-bottom: 1px solid var(--color-border); color: var(--color-text); flex-shrink: 0; backdrop-filter: var(--glass-blur);">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600;" id="image-viewer-title">
          <i data-lucide="image"></i> Bild-Vorschau
        </div>
        <button class="btn btn-icon close-btn" id="close-image-viewer-btn" style="padding: 0.25rem; background: transparent; border: none; color: var(--color-text);">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; overflow: hidden; position: relative;">
        <div id="image-viewer-container" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: transparent; overflow: hidden; padding: 0.5rem;">
          <img id="image-viewer-img" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: none;">
          <div id="image-viewer-loading" style="color: var(--color-accent); font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(0,210,255,0.1); border-left-color: var(--color-accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span>Lade Bild...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- VIDEO VIEWER MODAL -->
  <div class="modal-overlay" id="video-viewer-overlay" style="padding: 0; z-index: 10000; width: 100vw; height: 100vh; background: var(--modal-bg); backdrop-filter: var(--glass-blur);">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--glass-bg); border-bottom: 1px solid var(--color-border); color: var(--color-text); flex-shrink: 0; backdrop-filter: var(--glass-blur);">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600;" id="video-viewer-title">
          <i data-lucide="video"></i> Video-Vorschau
        </div>
        <button class="btn btn-icon close-btn" id="close-video-viewer-btn" style="padding: 0.25rem; background: transparent; border: none; color: var(--color-text);">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; overflow: hidden;">
        <video id="video-viewer-player" controls autoplay style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); outline: none; background: #000;"></video>
      </div>
    </div>
  </div>

  <!-- PDF VIEWER MODAL -->
  <div class="modal-overlay" id="pdf-viewer-overlay" style="display: none; padding: 0; z-index: 10000; width: 100vw; height: 100vh; background: var(--modal-bg);">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--glass-bg); border-bottom: 1px solid var(--color-border); color: var(--color-text); flex-shrink: 0; backdrop-filter: var(--glass-blur);">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600;" id="pdf-viewer-title">
          <i data-lucide="file-text"></i> PDF-Vorschau
        </div>
        <button class="btn btn-icon close-btn" id="close-pdf-viewer-btn" style="padding: 0.25rem; background: transparent; border: none; color: var(--color-text);">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div style="flex: 1; padding: 0; overflow: hidden; background: #525659; display: flex; justify-content: center; align-items: center;">
        <iframe id="pdf-viewer-iframe" style="width: 100%; height: 100%; border: none; background: #525659;" allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <!-- EUROOFFICE MODAL (FULLSCREEN COLLAB EDITOR) -->
  <div class="modal-overlay" id="office-editor-overlay" style="display: none; padding: 0; z-index: 10000; width: 100vw; height: 100vh; background: var(--color-bg);">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
      <!-- Eigene schmale Kopfleiste für den Schließen-Button, damit er nicht mit den nativen -->
      <!-- EuroOffice-Symbolen (z.B. Mitbearbeiter-Anzeige) oben rechts im Editor kollidiert. -->
      <div style="display: flex; justify-content: flex-end; align-items: center; padding: 0.4rem 0.6rem; background: #0d0d14; flex-shrink: 0;">
        <button class="btn" id="close-office-editor-btn" style="background: #ff5555; border-color: #ff5555; color: #fff; border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;" title="Beenden">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
      <div id="office-iframe-container" style="flex: 1; width: 100%; background: #fff;">
        <!-- Initialisiert EuroOffice DocsAPI -->
      </div>
    </div>
  </div>

  <!-- Client-side Logic Script for public share page -->
  <script>
    // Config und State
    const slug = window.location.pathname.split('/').pop();
    let currentFolderId = null;
    let shareConfig = null;
    let breadcrumbsHistory = [];
    let shareBranding = null;
    let hasAutoOpened = false;   // only auto-open a single-file viewer once

    // Active theme (explicit override or system preference)
    function getActiveTheme() {
      const explicit = document.documentElement.getAttribute('data-theme');
      if (explicit === 'light' || explicit === 'dark') return explicit;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // Apply the theme-appropriate dashboard background image (or the CSS gradient + orbs)
    function applyShareBackground() {
      const isDark = getActiveTheme() === 'dark';
      const orbs = document.getElementById('glowing-orbs-container');

      // Custom background colour overrides only the dark theme
      if (isDark && shareBranding && shareBranding.customColorBg) {
        document.documentElement.style.setProperty('--color-bg', shareBranding.customColorBg);
      } else {
        document.documentElement.style.removeProperty('--color-bg');
      }

      let chosen = null;
      if (shareBranding) {
        const has = shareBranding.hasDashboardBg;
        const hasLight = shareBranding.hasDashboardBgLight;
        const base = '/api/public/branding/dashboard-bg';
        if (!isDark) {
          if (hasLight) chosen = `${base}?variant=light&t=${Date.now()}`;
          else if (has) chosen = `${base}?t=${Date.now()}`;
        } else {
          if (has) chosen = `${base}?t=${Date.now()}`;
          else if (hasLight) chosen = `${base}?variant=light&t=${Date.now()}`;
        }
      }

      if (chosen) {
        document.body.style.backgroundImage = `url('${chosen}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundRepeat = 'no-repeat';
        if (orbs) orbs.style.display = 'none';
      } else {
        document.body.style.backgroundImage = '';
        if (orbs) orbs.style.display = 'block';
      }
    }

    // Toast Helper
    function showToast(message) {
      const toast = document.getElementById('public-toast');
      document.getElementById('public-toast-message').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Byte-Größen formatieren
    function formatBytes(bytes) {
      bytes = Number(bytes);
      if (!bytes || Number.isNaN(bytes) || bytes <= 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Daten laden
    async function loadShareData(folderId = null) {
      try {
        let url = `/api/public/shares/${slug}`;
        if (folderId) url += `?parentId=${folderId}`;

        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          document.getElementById('shared-title').innerHTML = `<i data-lucide="alert-triangle"></i> Fehler`;
          document.getElementById('shared-title').style.color = '#ff5555';
          document.getElementById('public-file-grid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--color-text-muted);">${err.error || 'Fehler beim Laden.'}</div>`;
          lucide.createIcons();
          return;
        }

        const data = await res.json();
        shareConfig = data.share;

        // Check if password required
        if (shareConfig.passwordRequired) {
          document.getElementById('password-block-view').style.display = 'block';
          document.getElementById('main-explorer').style.display = 'none';
          lucide.createIcons();
          return;
        } else {
          document.getElementById('password-block-view').style.display = 'none';
          const explorer = document.getElementById('main-explorer');
          explorer.style.display = 'block';
          explorer.classList.remove('view-enter');
          void explorer.offsetWidth; // reflow so the fade-in re-triggers
          explorer.classList.add('view-enter');
        }

        currentFolderId = data.currentFolderId;

        const isOnlyUpload = shareConfig.only_upload === true;
        const isFolder = data.baseFile.is_folder;
        const isSingleFile = !isFolder && !isOnlyUpload;

        const metaCard = document.getElementById('share-meta-card');
        const toolbar = document.getElementById('share-toolbar');
        const grid = document.getElementById('public-file-grid');
        const singleCard = document.getElementById('single-file-card');
        const dropzone = document.getElementById('public-dropzone');

        if (isSingleFile) {
          // Clean, download-focused single-file card — no folder chrome
          metaCard.style.display = 'none';
          toolbar.style.display = 'none';
          grid.style.display = 'none';
          dropzone.style.display = 'none';
          renderSingleFileCard(data.baseFile);
          if (!hasAutoOpened) {
            hasAutoOpened = true;
            autoOpenViewer(data.baseFile);
          }
          lucide.createIcons();
          return;
        }

        singleCard.style.display = 'none';
        metaCard.style.display = 'flex';

        // Render Meta Info
        document.getElementById('shared-title').innerHTML = `
          <i data-lucide="${isFolder ? 'folder' : 'file'}"></i> ${data.baseFile.name}
        `;

        // Badges
        const badges = [];
        if (isOnlyUpload) {
          badges.push('<span class="badge" style="background: rgba(0, 210, 255, 0.15); border-color: var(--color-accent);">Nur-Hochladen (Abgabe-Ordner)</span>');
        } else {
          if (shareConfig.can_read) badges.push('<span class="badge">Lesen</span>');
          if (shareConfig.can_write) badges.push('<span class="badge">Schreiben/Hochladen</span>');
          if (shareConfig.can_download) badges.push('<span class="badge">Download</span>');
          if (shareConfig.can_zip) badges.push('<span class="badge">ZIP-Export</span>');
        }
        document.getElementById('share-permissions-badges').innerHTML = badges.join('');

        // ZIP-Download Button anzeigen
        if (shareConfig.can_zip && isFolder && !isOnlyUpload) {
          const zipBtn = document.getElementById('download-all-zip-btn');
          zipBtn.style.display = 'inline-flex';
          zipBtn.onclick = () => {
            window.location.href = `/api/public/shares/${slug}/download-zip/${currentFolderId}`;
          };
        } else {
          document.getElementById('download-all-zip-btn').style.display = 'none';
        }

        // Schreibrechte aktivieren
        if (shareConfig.can_write && isFolder) {
          document.getElementById('public-upload-label').style.display = 'inline-flex';
          dropzone.style.display = 'block';
          document.getElementById('dropzone-text').textContent = isOnlyUpload
            ? 'Dateien ablegen, um sie anonym abzugeben'
            : 'Dateien per Drag & Drop in diese Freigabe hochladen';
        } else {
          document.getElementById('public-upload-label').style.display = 'none';
          dropzone.style.display = 'none';
        }

        // Layout elements visibility based on Only-Upload
        if (isOnlyUpload) {
          toolbar.style.display = 'none';
          grid.style.display = 'none';
        } else {
          toolbar.style.display = 'flex';
          grid.style.display = 'grid';
          updateBreadcrumbs(data.baseFile, currentFolderId);
          renderFiles(data.files);
        }

        lucide.createIcons();
      } catch (err) {
        console.error('Error loading share:', err);
        showToast('Fehler beim Verbinden mit dem Server.');
      }
    }

    // Categorise an extension for previews
    const SHARE_IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico', 'heic', 'heif', 'cr2', 'nef', 'dng', 'arw', 'orf', 'rw2', 'pef', 'raf'];
    const SHARE_VIDEO_EXTS = ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'flv', 'wmv', 'm4v'];
    const SHARE_CODE_EXTS = ['txt', 'js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx', 'html', 'xml', 'css', 'scss', 'less', 'py', 'json', 'yaml', 'yml', 'c', 'cpp', 'h', 'hpp', 'cs', 'go', 'rs', 'java', 'sh', 'bash', 'md', 'php', 'rb', 'sql'];
    const SHARE_OFFICE_EXTS = ['docx', 'xlsx', 'pptx', 'odt', 'ods', 'odp'];

    function shareFileIconName(file) {
      if (file.is_folder) return 'folder';
      const ext = file.name.split('.').pop().toLowerCase();
      if (['docx', 'doc', 'odt', 'rtf', 'pdf'].includes(ext)) return 'file-text';
      if (['xlsx', 'xls', 'ods', 'csv'].includes(ext)) return 'file-spreadsheet';
      if (['pptx', 'ppt', 'odp'].includes(ext)) return 'presentation';
      if (SHARE_IMAGE_EXTS.includes(ext)) return 'file-image';
      if (SHARE_VIDEO_EXTS.includes(ext)) return 'file-video';
      if (SHARE_CODE_EXTS.includes(ext)) return 'file-code';
      if (['zip', 'tar', 'gz', 'rar', '7z', 'bz2', 'xz'].includes(ext)) return 'file-archive';
      return 'file';
    }

    function openShareFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (SHARE_IMAGE_EXTS.includes(ext)) openImageViewer(file.id, file.name, true, slug);
      else if (SHARE_VIDEO_EXTS.includes(ext)) openVideoViewer(file.id, file.name, true, slug);

          document.documentElement.style.setProperty('--color-accent', data.customColorAccent);
          
          const hexToRgbA = (hex, alpha) => {
            let c;
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
              c = hex.substring(1).split('');
              if (c.length === 3) {
                c = [c[0], c[0], c[1], c[1], c[2], c[2]];
              }
              c = '0x' + c.join('');
              return 'rgba(' + [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',') + ',' + alpha + ')';
            }
            return hex;
          };
          
          document.documentElement.style.setProperty('--color-border', hexToRgbA(data.customColorAccent, 0.2));
          document.documentElement.style.setProperty('--color-border-active', hexToRgbA(data.customColorAccent, 0.8));

      const zOf = (el) => { const z = parseInt(window.getComputedStyle(el).zIndex, 10); return Number.isNaN(z) ? 0 : z; };

    function initCollabSocket(fileId, username, userId, isPublic = false, slug = '', isGuest = false) {
      if (collabSocket) {
        collabSocket.close();
        collabSocket = null;
      }

      collabUserColorMap = {};
      myCollabUserId = userId;

      collabUserDecorations = {};

      const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = window.location.host;
      
      let wsUrl = `${wsProto}//${wsHost}/api/collab?fileId=${fileId}&username=${encodeURIComponent(username)}&userId=${userId}`;
      if (isGuest) wsUrl += `&guest=1`;
      if (isPublic) {
        wsUrl += `&slug=${slug}`;
      }

      collabSocket = new WebSocket(wsUrl);

      collabSocket.onopen = () => {
        console.log('Collaboration WebSocket connected.');
      };

      collabSocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'init') {
            collabUserColor = data.color;
            if (data.userId) myCollabUserId = data.userId;
            updateCollabUsersListUI(data.users);
          } else if (data.type === 'user_joined') {
            updateCollabUsersListUI(data.users);
            showToast(`${data.username} hat den Editor betreten.`);
          } else if (data.type === 'user_left') {
            updateCollabUsersListUI(data.users);
            showToast(`${data.username} hat den Editor verlassen.`);
            if (collabUserDecorations[data.userId]) {
              if (monacoEditorInstance) {
                monacoEditorInstance.deltaDecorations(collabUserDecorations[data.userId], []);
              }
              delete collabUserDecorations[data.userId];
            }
            removeCollabUserStyles(data.userId);
          } else if (data.type === 'edit') {
            if (!monacoEditorInstance) return;
            isApplyingRemoteEdit = true;
            const model = monacoEditorInstance.getModel();
            const edits = data.changes.map(change => ({
              range: new monaco.Range(
                change.range.startLineNumber,
                change.range.startColumn,
                change.range.endLineNumber,
                change.range.endColumn
              ),
              text: change.text,
              forceMoveMarkers: true
            }));
            model.applyEdits(edits);
            isApplyingRemoteEdit = false;
          } else if (data.type === 'cursor') {
            if (!monacoEditorInstance) return;
            
            const targetUserId = data.userId;
            const targetUsername = data.username;
            const position = data.position;
            const selection = data.selection;

            let color = collabUserColorMap[targetUserId];
            if (!color) {
              const colors = ['#00d2ff', '#ff5555', '#50fa7b', '#ffb86c', '#ff79c6', '#bd93f9', '#f1fa8c', '#8be9fd'];
              let hash = 0;
              for (let i = 0; i < targetUserId.length; i++) {
                hash = targetUserId.charCodeAt(i) + ((hash << 5) - hash);
              }
              color = colors[Math.abs(hash) % colors.length];
            }

            addCollabUserStyles(targetUserId, color, targetUsername);

            const decorations = [];
            if (selection && (selection.startLineNumber !== selection.endLineNumber || selection.startColumn !== selection.endColumn)) {
              decorations.push({
                range: new monaco.Range(selection.startLineNumber, selection.startColumn, selection.endLineNumber, selection.endColumn),
                options: {
                  className: `collab-selection-${targetUserId}`,
                  hoverMessage: { value: targetUsername }
                }
              });
            }

            if (position) {
              decorations.push({
                range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column),
                options: {
                  className: `collab-cursor-${targetUserId}`,
                  afterContentClassName: `collab-cursor-tooltip-${targetUserId}`,
                  hoverMessage: { value: targetUsername }
                }
              });
            }

            const oldDecs = collabUserDecorations[targetUserId] || [];
            collabUserDecorations[targetUserId] = monacoEditorInstance.deltaDecorations(oldDecs, decorations);
          }
        } catch (err) {
          console.error('Error handling collaborative WS message:', err);
        }
      };

      collabSocket.onclose = () => {
        console.log('Collaboration WebSocket disconnected.');
      };
    }

    function updateCollabUsersListUI(users) {
      const container = document.getElementById('collab-users-container');
      const listEl = document.getElementById('collab-users-list');

      if (Array.isArray(users)) {
        users.forEach(u => { if (u.userId) collabUserColorMap[u.userId] = u.color; });
      }

      if (!container || !listEl) return;

      if (!users || users.length <= 1) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      const otherUsers = users.filter(u => u.userId !== myCollabUserId);
      const names = otherUsers.map(u => `<span style="color: ${u.color}; font-weight: bold;">${u.username}</span>`);
      listEl.innerHTML = names.length ? `Andere online: ${names.join(', ')}` : 'Nur du';
    }

    let currentEditingFileId = null;

    async function openCodeEditor(fileId, fileName, isPublic = false, slug = '') {
      showToast('Lade Code-Editor...');
      currentEditingFileId = fileId;

      try {
        const url = isPublic 
          ? `/api/public/shares/${slug}/content/${fileId}`
          : `/api/files/content/${fileId}`;
          
        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          showToast(err.error || 'Fehler beim Laden des Datei-Inhalts.');
          return;
        }
        const textContent = await res.text();

        await loadMonaco();

        document.getElementById('code-editor-title').textContent = fileName;
        lucide.createIcons();

        document.getElementById('code-editor-overlay').classList.add('active');
        const collabContainer = document.getElementById('collab-users-container');
        if (collabContainer) {
          collabContainer.style.display = 'none';
        }

        let readOnly = false;
        if (isPublic && shareConfig && !shareConfig.can_write) {
          readOnly = true;
        }

        const saveBtn = document.getElementById('save-code-editor-btn');
        if (saveBtn) saveBtn.style.display = readOnly ? 'none' : '';
        const kbdHint = document.querySelector('#code-editor-overlay .editor-kbd');
        if (kbdHint) kbdHint.style.display = readOnly ? 'none' : '';

        // "Link teilen" copies the current share URL to the clipboard
        const shareLinkBtn = document.getElementById('share-link-btn');
        if (shareLinkBtn) {
          shareLinkBtn.style.display = isPublic ? '' : 'none';
          shareLinkBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(window.location.href);
              showToast('Freigabe-Link in die Zwischenablage kopiert!');
            } catch {
              showToast('Link konnte nicht kopiert werden.');
            }
          };
        }

        const container = document.getElementById('monaco-editor-container');
        container.innerHTML = ''; // Clear previous

        const language = getMonacoLanguage(fileName);

        // Sync language selector with the detected language
        const langSelect = document.getElementById('monaco-lang-select');
        if (langSelect) langSelect.value = language;

        monacoEditorInstance = monaco.editor.create(container, {
          value: textContent,
          language: language,
          theme: 'vs-dark',
          automaticLayout: true,
          readOnly: readOnly,
          fontSize: 14,
          minimap: { enabled: true },
          bracketPairColorization: {
            enabled: true
          },
          'semanticHighlighting.enabled': true,
          colorDecorators: true
        });

        // Language selector handler
        if (langSelect) {
          langSelect.onchange = () => {
            const model = monacoEditorInstance.getModel();
            if (model) monaco.editor.setModelLanguage(model, langSelect.value);
          };
        }

        // Start Collaboration WebSocket — the server assigns a unique animal name & colour
        const collabUserId = `guest_${Math.random().toString(36).substring(2, 11)}`;
        initCollabSocket(fileId, '', collabUserId, isPublic, slug, true);

        // Send edits to other collaborators in real-time on keypress/change
        monacoEditorInstance.onDidChangeModelContent((event) => {
          if (isApplyingRemoteEdit) return;
          if (collabSocket && collabSocket.readyState === WebSocket.OPEN) {
            collabSocket.send(JSON.stringify({
              type: 'edit',
              changes: event.changes
            }));
          }

          // 1.5s Debounced Auto-save to the database
          if (autoSaveDebounceTimeout) {
            clearTimeout(autoSaveDebounceTimeout);
          }
          autoSaveDebounceTimeout = setTimeout(async () => {
            if (!monacoEditorInstance || readOnly) return;
            const currentContent = monacoEditorInstance.getValue();
            try {
              const saveUrl = isPublic 
                ? `/api/public/shares/${slug}/content/${fileId}`
                : `/api/files/content/${fileId}`;
              await fetch(saveUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: currentContent })
              });
            } catch (e) {
              console.error('Autosave error:', e);
            }
          }, 1500);
        });

        // Send cursor position & selection to other collaborators in real-time
        const sendCursorUpdate = () => {
          if (isApplyingRemoteEdit) return;
          if (collabSocket && collabSocket.readyState === WebSocket.OPEN) {
            collabSocket.send(JSON.stringify({
              type: 'cursor',
              position: monacoEditorInstance.getPosition(),
              selection: monacoEditorInstance.getSelection()
            }));
          }
        };

        monacoEditorInstance.onDidChangeCursorPosition(sendCursorUpdate);
        monacoEditorInstance.onDidChangeCursorSelection(sendCursorUpdate);

        if (!readOnly) {
          const doSave = async () => {
            const updatedContent = monacoEditorInstance.getValue();
            showToast('Speichere Datei...');

            try {
              const saveUrl = isPublic
                ? `/api/public/shares/${slug}/content/${fileId}`
                : `/api/files/content/${fileId}`;

              const saveRes = await fetch(saveUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: updatedContent })
              });

              if (saveRes.ok) {
                showToast('Datei erfolgreich gespeichert.');
              } else {
                const err = await saveRes.json();
                showToast(err.error || 'Fehler beim Speichern.');
              }
            } catch (err) {
              showToast('Verbindungsfehler beim Speichern.');
            }
          };

          document.getElementById('save-code-editor-btn').onclick = doSave;
          // Ctrl/Cmd + S saves from within the editor
          monacoEditorInstance.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, doSave);
        }
      } catch (err) {
        console.error('Error opening code editor:', err);
        showToast('Code-Editor konnte nicht geladen werden.');
      }
    }

    document.getElementById('close-code-editor-btn').onclick = () => {
      if (collabSocket) {
        collabSocket.close();
        collabSocket = null;
      }
      if (autoSaveDebounceTimeout) {
        clearTimeout(autoSaveDebounceTimeout);
        autoSaveDebounceTimeout = null;
      }
      document.querySelectorAll('[id^="collab-styles-"]').forEach(el => el.remove());

      if (monacoEditorInstance) {
        monacoEditorInstance.dispose();
        monacoEditorInstance = null;
      }
      document.getElementById('code-editor-overlay').classList.remove('active');
      loadShareData(currentFolderId);
    };

    let heicLibLoaded = false;
    function loadHeicLib() {
      return new Promise((resolve, reject) => {
        if (heicLibLoaded) return resolve();
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
        script.onload = () => {
          heicLibLoaded = true;
          resolve();
        };
        script.onerror = () => reject(new Error('heic2any failed to load.'));
        document.head.appendChild(script);
      });
    }

    let currentImageObjectUrl = null;

    async function openImageViewer(fileId, fileName, isPublic = false, slug = '') {
      const overlay = document.getElementById('image-viewer-overlay');
      const img = document.getElementById('image-viewer-img');
      const loading = document.getElementById('image-viewer-loading');
      const title = document.getElementById('image-viewer-title');

      title.innerHTML = `<i data-lucide="image"></i> ${fileName}`;
      lucide.createIcons();
      
      img.style.display = 'none';
      loading.style.display = 'flex';
      overlay.classList.add('active');

      if (currentImageObjectUrl) {
        URL.revokeObjectURL(currentImageObjectUrl);
        currentImageObjectUrl = null;
      }

      const downloadUrl = isPublic 
        ? `/api/public/shares/${slug}/download/${fileId}`
        : `/api/files/download/${fileId}`;

      const ext = fileName.split('.').pop().toLowerCase();
      
      try {
        if (['heic', 'heif'].includes(ext)) {
          const response = await fetch(downloadUrl);
          if (!response.ok) throw new Error('Failed to fetch image file.');
          const blob = await response.blob();
          
          await loadHeicLib();
          const convertedBlob = await heic2any({
            blob,
            toType: 'image/jpeg',
            quality: 0.8
          });
          
          currentImageObjectUrl = URL.createObjectURL(convertedBlob);
          img.src = currentImageObjectUrl;
        } else if (['cr2', 'nef', 'dng', 'arw', 'orf', 'rw2', 'pef', 'raf'].includes(ext)) {
          const thumbUrl = isPublic
            ? `/api/public/shares/${slug}/thumbnail/${fileId}`
            : `/api/files/thumbnail/${fileId}`;
          img.src = thumbUrl;
        } else {
          img.src = downloadUrl;
        }

        img.onload = () => {
          loading.style.display = 'none';
          img.style.display = 'block';
        };
        img.onerror = () => {
          loading.style.display = 'none';
          title.innerHTML = `<i data-lucide="alert-circle" style="color: #ff5555;"></i> Fehler beim Laden des Bildes`;
          lucide.createIcons();
        };
      } catch (err) {
        console.error('Image viewer error:', err);
        loading.style.display = 'none';
        title.innerHTML = `<i data-lucide="alert-circle" style="color: #ff5555;"></i> Fehler beim Laden des Bildes`;
        lucide.createIcons();
      }
    }

    document.getElementById('close-image-viewer-btn').onclick = () => {
      document.getElementById('image-viewer-overlay').classList.remove('active');
      const img = document.getElementById('image-viewer-img');
      img.src = '';
      if (currentImageObjectUrl) {
        URL.revokeObjectURL(currentImageObjectUrl);
        currentImageObjectUrl = null;
      }
    };

    function openVideoViewer(fileId, fileName, isPublic = false, slug = '') {
      const overlay = document.getElementById('video-viewer-overlay');
      const player = document.getElementById('video-viewer-player');
      const title = document.getElementById('video-viewer-title');

      title.innerHTML = `<i data-lucide="video"></i> ${fileName}`;
      lucide.createIcons();

      const sourceUrl = isPublic 
        ? `/api/public/shares/${slug}/download/${fileId}`
        : `/api/files/download/${fileId}`;

      player.src = sourceUrl;
      overlay.classList.add('active');
    }

    document.getElementById('close-video-viewer-btn').onclick = () => {
      document.getElementById('video-viewer-overlay').classList.remove('active');
      const player = document.getElementById('video-viewer-player');
      player.pause();
      player.src = '';
    };

    function openPdfViewer(fileId, fileName, isPublic = false, slug = '') {
      const overlay = document.getElementById('pdf-viewer-overlay');
      const iframe = document.getElementById('pdf-viewer-iframe');
      const title = document.getElementById('pdf-viewer-title');

      title.innerHTML = `<i data-lucide="file-text"></i> ${fileName}`;
      lucide.createIcons();

      const sourceUrl = isPublic 
        ? `/api/public/shares/${slug}/download/${fileId}?inline=true`
        : `/api/files/download/${fileId}?inline=true`;

      iframe.src = sourceUrl;
      overlay.style.display = 'flex';
      overlay.classList.add('active');
    }

    document.getElementById('close-pdf-viewer-btn').onclick = () => {
      const overlay = document.getElementById('pdf-viewer-overlay');
      overlay.classList.remove('active');
      overlay.style.display = 'none';
      document.getElementById('pdf-viewer-iframe').src = '';
    };

    // EuroOffice collaborative editor (public share) — only available when the
    // share link has the "Gemeinsames Bearbeiten" permission enabled
    let docEditorInstance = null;

    function loadOfficeScript(publicUrl) {
      return new Promise((resolve, reject) => {
        if (window.DocsAPI) return resolve();
        const script = document.createElement('script');
        script.src = `${publicUrl}/web-apps/apps/api/documents/api.js`;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('EuroOffice Script konnte nicht geladen werden.'));
        document.head.appendChild(script);
      });
    }

    async function openOfficeEditorPublic(fileId, fileName, slug) {
      showToast('Bereite Office-Editor vor...');

      try {
        const res = await fetch(`/api/public/shares/${slug}/eurooffice/config/${fileId}`);
        if (!res.ok) {
          const err = await res.json();
          showToast(err.error || 'Fehler beim Laden der Office-Konfiguration.');
          return;
        }

        let { publicUrl, config } = await res.json();

        // Adjust the document server's public hostname to match the browser's,
        // to avoid cross-origin/DNS mismatches (e.g. localhost vs. the real host).
        try {
          const parsedPublicUrl = new URL(publicUrl);
          if (parsedPublicUrl.hostname === 'localhost' || parsedPublicUrl.hostname === '127.0.0.1') {
            const browserUrl = new URL(window.location.href);
            parsedPublicUrl.hostname = browserUrl.hostname;
            publicUrl = parsedPublicUrl.toString().replace(/\/$/, '');
          }
        } catch (e) {
          console.error('Error adjusting EuroOffice publicUrl hostname:', e);
        }

        await loadOfficeScript(publicUrl);

        const container = document.getElementById('office-iframe-container');
        container.innerHTML = '<div id="office-iframe-placeholder" style="width:100%; height:100%;"></div>';

        const officeOverlayEl = document.getElementById('office-editor-overlay');
        officeOverlayEl.style.display = 'block';
        officeOverlayEl.classList.add('active');

        docEditorInstance = new DocsAPI.DocEditor('office-iframe-placeholder', config);
      } catch (err) {
        console.error('Error opening public office editor:', err);
        showToast('EuroOffice Server ist momentan nicht erreichbar.');
      }
    }

    document.getElementById('close-office-editor-btn').onclick = () => {
      if (docEditorInstance) {
        docEditorInstance.destroyEditor();
        docEditorInstance = null;
      }
      const officeOverlayEl = document.getElementById('office-editor-overlay');
      officeOverlayEl.style.display = 'none';
      officeOverlayEl.classList.remove('active');
    };

    // Backdrop click close for public overlays
    ['code-editor-overlay', 'image-viewer-overlay', 'video-viewer-overlay', 'pdf-viewer-overlay'].forEach(id => {
      const overlay = document.getElementById(id);
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            if (id === 'code-editor-overlay') {
              // Do not close code editor on background click
            } else if (id === 'image-viewer-overlay') {
              document.getElementById('close-image-viewer-btn').click();
            } else if (id === 'video-viewer-overlay') {
              document.getElementById('close-video-viewer-btn').click();
            } else if (id === 'pdf-viewer-overlay') {
              document.getElementById('close-pdf-viewer-btn').click();
            }
          }
        });
      }
    });

    // Disable background scrolling when any modal is open on public share page
    function checkModalsScrollLock() {
      const overlays = document.querySelectorAll('.modal-overlay');
      let anyOpen = false;
      overlays.forEach(overlay => {
        const isClassActive = overlay.classList.contains('active');
        const isStyleVisible = overlay.style.display && overlay.style.display !== 'none';
        if (isClassActive || isStyleVisible) {
          anyOpen = true;
        }
      });

      if (anyOpen) {
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
      }
    }

    const modalObserver = new MutationObserver(() => {
      checkModalsScrollLock();
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      modalObserver.observe(overlay, { attributes: true, attributeFilter: ['class', 'style'] });
    });

    checkModalsScrollLock();
  </script>
