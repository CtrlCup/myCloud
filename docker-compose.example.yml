# COMPOSE_VERSION=1.2.0
# Wird von myCloud beim Start mit der vom Code erwarteten Version verglichen (siehe
# app/version.js) und in der Admin-Konsole angezeigt, falls diese Datei veraltet ist.
# Beim manuellen Übernehmen von Struktur-Änderungen aus dem Repository entsprechend
# mit hochzählen.

services:
  db:
    image: postgres:15-alpine
    container_name: mycloud_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mycloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mycloud_secure_password}
      POSTGRES_DB: ${DB_NAME:-mycloud}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mycloud_network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mycloud_app
    restart: always
    # Standardmäßig wird der Port auf den Host gemappt (ports), damit die App direkt
    # erreichbar ist. Läuft davor bereits ein Reverse-Proxy im selben Docker-Netzwerk
    # (mycloud_network), kann stattdessen "expose" verwendet werden — dazu den ports-Block
    # auskommentieren und den expose-Block darunter aktivieren.
    ports:
      - "${PORT:-3000}:3000"
    # expose:
    #   - "3000"
    volumes:
      - uploads_data:/usr/src/app/uploads
      - ./.env:/usr/src/app/.env
      - ./docker-compose.yml:/usr/src/app/docker-compose.yml:ro
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mycloud}:${DB_PASSWORD:-mycloud_secure_password}@db:5432/${DB_NAME:-mycloud}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_to_a_long_random_string}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_ISSUER_URL: ${SSO_ISSUER_URL}
      # "Primäre" Domain (siehe Issue #2) — wird nur noch für Dinge verwendet, die zwingend
      # eine einzelne feste Domain brauchen (Absenderlink in Verifizierungs-/Passwort-Reset-
      # Mails, secure-Cookie-Flag). Freigabe-/Einmalnachrichten-Links funktionieren unter jeder
      # Domain, über die die App tatsächlich aufgerufen wird (siehe getExpectedOrigin in
      # server.js) — dafür ist keine weitere Konfiguration nötig, auch nicht bei mehreren
      # Domains/Reverse-Proxy-Hosts.
      APP_URL: ${APP_URL:-http://localhost:3030}
      EURO_OFFICE_URL: ${EURO_OFFICE_URL:-http://eurooffice:80}
      EURO_OFFICE_PUBLIC_URL: ${EURO_OFFICE_PUBLIC_URL:-http://localhost:8080}
    networks:
      - mycloud_network
      # Läuft bereits ein Reverse-Proxy (z. B. Caddy, siehe Caddyfile.example) in einem eigenen
      # Docker-Netzwerk und soll den app-Container direkt ansprechen, statt über den auf den
      # Host gemappten Port zu gehen: das Netzwerk unten aktivieren (muss vorher extern existieren,
      # z. B. `docker network create proxy`) und im Proxy-Stack denselben Netzwerknamen verwenden.
      # - proxy

  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: mycloud_eurooffice
    restart: always
    # Nur intern über das mycloud_network erreichbar (z. B. für einen Reverse-Proxy),
    # da der Document-Server aktuell ausschließlich für dieses Projekt verwendet wird.
    expose:
      - "80"
    environment:
      JWT_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c", "cp /tmp/local.json /etc/euro-office/documentserver/local.json && exec /entrypoint.sh"]
    volumes:
      - eurooffice_data:/var/lib/euro-office/documentserver
      - eurooffice_logs:/var/log/euro-office/documentserver
      - ./eurooffice-local.json:/tmp/local.json:ro
    networks:
      - mycloud_network

volumes:
  db_data:
  uploads_data:
  eurooffice_data:
  eurooffice_logs:

networks:
  mycloud_network:
    driver: bridge
  # Nur nötig, wenn oben bei app.networks "- proxy" aktiviert wurde (siehe Kommentar dort).
  # proxy:
  #   external: true
